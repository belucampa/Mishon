<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Elegí una contraseña nueva</title>
</head>
<body style="margin:0;padding:0;background:#FAEC7F;color-scheme:light only;">
<div style="display:none;max-height:0;overflow:hidden;">El enlace vale por un rato.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAEC7F;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
      <tr><td align="center" style="padding-bottom:16px;">
        <img src="https://mishon.com.ar/mail-encabezado.png" alt="Mishón" width="520" style="display:block;width:100%;max-width:520px;height:auto;border:0;">
      </td></tr>
      <tr><td style="background:#F7F3EC;border:2px solid #212121;border-radius:24px;padding:32px 28px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center;">
        <img src="https://mishon.com.ar/gatotaza-crema.png" alt="" width="120" style="width:120px;height:auto;border:0;margin:0 auto 16px;display:block;">
        <h1 style="margin:0 0 20px;font-family:Georgia,serif;font-size:26px;line-height:1.25;color:#212121;">¿Te olvidaste la contraseña?</h1>
        <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:#212121;">Pasa. Apretá el botón para elegir una nueva.</p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px auto 0;">
          <tr><td style="border-radius:999px;background:#E24B4A;border:2px solid #212121;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;color:#F7F3EC;text-decoration:none;">Elegir contraseña nueva</a>
          </td></tr>
        </table>
        <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#212121;opacity:.7;">Si no pediste esto, ignorá este mail: tu contraseña sigue igual.</p>
      </td></tr>
      <tr><td align="center" style="padding-top:24px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#212121;">
        Mishón · café de especialidad argentino<br>
        <a href="https://instagram.com/mishoncafe" style="color:#212121;">@mishoncafe</a> · <a href="https://mishon.com.ar" style="color:#212121;">mishon.com.ar</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
